name: CD - Deploy Application

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        default: master
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or commit SHA)"
        required: false
        type: string
        default: master

env:
  AWS_REGION: us-east-1
  APP_DIR: src
  ARTIFACT_PREFIX: artifacts
  ARTIFACT_NAME: sport-facility-bookings-app.zip
  APP_TAG: sport-facility-bookings

permissions:
  contents: read

jobs:
  infra:
    name: Apply infrastructure (prerequisite for app deploy)
    uses: ./.github/workflows/build.yml
    with:
      action: apply
    secrets: inherit

  app:
    name: Build & deploy app to ASG instances
    needs: infra
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ${{ needs.infra.outputs.s3_bucket }}
      ASG_NAME: ${{ needs.infra.outputs.asg_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install app dependencies (AWS SDK for PHP)
        working-directory: ${{ env.APP_DIR }}
        run: composer install --no-dev --optimize-autoloader

      - name: Package application
        working-directory: ${{ env.APP_DIR }}
        run: zip -r "../${{ env.ARTIFACT_NAME }}" . -x "uploads/*"

      - name: Upload artifact to S3
        run: |
          aws s3 cp "${{ env.ARTIFACT_NAME }}" \
            "s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/${{ env.ARTIFACT_NAME }}"

      - name: Wait for any in-progress ASG instance refresh to settle
        run: |
          set -euo pipefail

          # 'terraform apply' in the infra job may have picked up a newer
          # AMI (data "aws_ami" uses most_recent = true) or another launch
          # template change, which kicks off aws_autoscaling_group's Rolling
          # instance_refresh in the background. Terraform doesn't wait for
          # that to finish, so if we proceed immediately we can target an
          # instance that's about to be replaced (InvocationDoesNotExist).
          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "${{ env.ASG_NAME }}" \
              --max-records 1 \
              --query "InstanceRefreshes[0].Status" --output text 2>/dev/null || echo "None")

            case "$STATUS" in
              InProgress|Pending|Cancelling)
                echo "Instance refresh status: $STATUS - waiting (attempt $i/30)..."
                sleep 10
                ;;
              *)
                echo "No in-progress instance refresh (status: $STATUS)."
                exit 0
                ;;
            esac
          done

          echo "Timed out waiting for instance refresh to settle."
          exit 1

      - name: Wait for an SSM-managed running instance
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            INSTANCE_IDS=$(aws ec2 describe-instances \
              --filters "Name=tag:App,Values=${{ env.APP_TAG }}" "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" --output text)

            if [ -n "$INSTANCE_IDS" ]; then
              IDS_CSV=$(echo "$INSTANCE_IDS" | tr '\t ' ',' | sed 's/,,*/,/g; s/^,//; s/,$//')
              ONLINE_COUNT=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$IDS_CSV" \
                --query "length(InstanceInformationList[?PingStatus=='Online'])" --output text)

              if [ "$ONLINE_COUNT" != "0" ] && [ "$ONLINE_COUNT" != "None" ]; then
                echo "Found $ONLINE_COUNT SSM-managed instance(s) online."
                exit 0
              fi
            fi

            echo "Waiting for at least one running + SSM-online instance (attempt $i/30)..."
            sleep 10
          done

          echo "Timed out waiting for a running, SSM-managed instance."
          exit 1

      - name: Deploy to ASG instances via SSM
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:App,Values=${{ env.APP_TAG }}" \
            --comment "${{ env.APP_TAG }} deploy" \
            --parameters '{"commands":[
              "cloud-init status --wait",
              "aws s3 cp s3://${{ env.ARTIFACT_BUCKET }}/${{ env.ARTIFACT_PREFIX }}/${{ env.ARTIFACT_NAME }} /tmp/app-deploy.zip",
              "sudo rm -rf /var/www/html/*",
              "sudo unzip -o /tmp/app-deploy.zip -d /var/www/html",
              "sudo systemctl restart php-fpm || true",
              "sudo systemctl restart httpd"
            ]}' \
            --query "Command.CommandId" --output text)

          if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
            echo "send-command returned no CommandId - no instances matched tag App=${{ env.APP_TAG }} at dispatch time."
            exit 1
          fi

          # Don't reuse an instance-ID list captured before send-command: the
          # ASG may be mid instance-refresh (e.g. a new AMI picked up by
          # 'most_recent = true' rolling the launch template), so an instance
          # that was "running" a moment ago can be gone by the time SSM
          # resolves the tag-based --targets, causing InvocationDoesNotExist.
          # Instead, ask SSM which instances the command actually targeted,
          # giving it a few seconds to register the invocations first.
          TARGET_IDS=""
          for i in $(seq 1 6); do
            TARGET_IDS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --query "CommandInvocations[].InstanceId" --output text)
            if [ -n "$TARGET_IDS" ]; then
              break
            fi
            echo "No invocations registered yet, retrying ($i/6)..."
            sleep 5
          done

          if [ -z "$TARGET_IDS" ]; then
            echo "No SSM invocations were created for command $COMMAND_ID - target instance(s) disappeared before dispatch completed."
            exit 1
          fi

          OVERALL_SUCCESS=true
          for id in $TARGET_IDS; do
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$id" || true
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id" --query "Status" --output text)
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$id"
            if [ "$STATUS" != "Success" ]; then
              OVERALL_SUCCESS=false
            fi
          done

          if [ "$OVERALL_SUCCESS" = false ]; then
            echo "SSM deployment failed on one or more instances."
            exit 1
          fi
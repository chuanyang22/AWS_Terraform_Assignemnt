name: Get Logs
on:
  workflow_dispatch: {}
env:
  APP_TAG: sport-facility-bookings
permissions:
  contents: read
jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Get error logs
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:App,Values=${{ env.APP_TAG }}" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          COMMAND_ID=$(aws ssm send-command --document-name "AWS-RunShellScript" --instance-ids "$INSTANCE_ID" --parameters '{"commands":["tail -n 50 /var/log/php-fpm/www-error.log /var/log/httpd/error_log /var/log/php-fpm/error.log"]}' --query "Command.CommandId" --output text)
          sleep 5
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text

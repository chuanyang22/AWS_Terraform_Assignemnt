name: Debug Instance
on: workflow_dispatch
env:
  AWS_REGION: us-east-1
  APP_TAG: sport-facility-bookings
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run debug script on instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:App,Values=${{ env.APP_TAG }}" "Name=instance-state-name,Values=running" --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then echo "No running instance found"; exit 1; fi
          echo "Targeting instance $INSTANCE_ID"
          COMMAND_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters 'commands=["cat <<EOF > /tmp/test_mysqli.php\n<?php\nmysqli_report(MYSQLI_REPORT_OFF);\n\$conn = @new mysqli(\"fake-host.rds.amazonaws.com\", \"admin\", \"password\", \"db\");\nif (\$conn->connect_error) echo \"FAKE: \" . \$conn->connect_error . \"\n\";\n\$conn2 = @new mysqli(\"localhost\", \"admin\", \"password\", \"db\");\nif (\$conn2->connect_error) echo \"LOCALHOST: \" . \$conn2->connect_error . \"\n\";\n\$conn3 = @new mysqli(\"\", \"admin\", \"password\", \"db\");\nif (\$conn3->connect_error) echo \"EMPTY: \" . \$conn3->connect_error . \"\n\";\nEOF\nphp /tmp/test_mysqli.php"]' --query "Command.CommandId" --output text)
          sleep 10
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text

